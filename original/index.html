<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook</title>
<style>
:root{--t1:#F6A961;--t2:#E56B5E;--t3:#BB405C;--t4:#843660;--t5:#583168;--deep:#2B1A35;--deep-rgb:43,26,53;--tint-rgb:88,49,104;
--tick1:#F6A961;--tick2:#E56B5E;--tick-ink:#2B1A35;--hi:#F6A961;--accent-l:#BB405C;--accent-d:#E56B5E;--done-l:#843660;--done-d:#F6A961;
--btn:linear-gradient(100deg,#E56B5E,#BB405C 55%,#843660);
--sand:var(--t1);--terra:var(--t2);--blush:var(--t3);--camelot:var(--t4);--bossa:var(--t5);
--bg:#FBF6F2;--card:#fff;--ink:#2B1A35;--mute:#8C7B8F;--line:#EEE3DE;--soft:#F6EDE8;--accent:var(--accent-l);--done:var(--done-l);--danger:#C8384F;
--grad:linear-gradient(90deg,var(--t1),var(--t2),var(--t3),var(--t4),var(--t5))}
@media (prefers-color-scheme:dark){:root{--bg:#170F1D;--card:#221729;--ink:#F7EEF2;--mute:#A693A9;--line:#33253B;--soft:#2B1E33;--accent:var(--accent-d);--done:var(--done-d);--danger:#FF6F7D}}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--deep)}
html,body{overscroll-behavior-y:none}
#app{min-height:100vh;display:flex;flex-direction:column;background:var(--deep);overflow-x:clip;max-width:100%}
#banner{background:var(--bg)}
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{flex:1 0 auto;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font-size:16px!important}
html,body,button,input,select,label{touch-action:manipulation}
body{overflow-x:hidden}
input{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
input:focus{border-color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--st)) calc(16px + var(--sr)) 12px calc(16px + var(--sl));background:linear-gradient(110deg,var(--t5) 0%,var(--t4) 55%,var(--t3) 100%);color:#fff;transition:background .6s}
.logo{width:28px;height:28px;border-radius:9px;background:conic-gradient(from 200deg,var(--t1),var(--t2),var(--t3),var(--t4),var(--t5),var(--t1));box-shadow:0 0 0 2px rgba(255,255,255,.25);position:relative;flex:none}
.logo::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
.brand b{font-size:19px;letter-spacing:-.02em;font-weight:800}
.brand .bdate{font-size:13px;opacity:.85;font-weight:600}
.hpad{padding:10px calc(14px + var(--sr)) 10px calc(14px + var(--sl))}
.nav:empty{display:none}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.tabs{display:flex;background:var(--soft);border-radius:10px;padding:3px;border:1px solid var(--line)}
.tabs button{flex:1;padding:7px 4px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mute)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nav{margin-top:10px}
main.home{padding:0}
.hero{position:relative;min-height:calc(100vh - 118px);min-height:calc(100dvh - 118px);overflow:hidden;color:#fff;display:flex;flex-direction:column}
.hero{background:linear-gradient(180deg,var(--t5),var(--t4) 32%,var(--t3) 55%,var(--t2) 72%,var(--t1))}
.slides{position:absolute;inset:0;overflow:hidden}
.slide{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;opacity:0;transform:scale(1.02);transition:opacity 2.4s ease,transform 13s linear;will-change:opacity,transform}
.slide.on{opacity:1;transform:scale(1.09)}
.slide.out{opacity:0;transform:scale(1.09)}
.slides::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(var(--deep-rgb),.62) 0%,rgba(var(--tint-rgb),.25) 32%,rgba(var(--tint-rgb),.05) 50%,rgba(var(--tint-rgb),.45) 72%,rgba(var(--deep-rgb),.88) 100%)}
.dots{display:flex;gap:5px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:all .4s}
.dots i.on{width:18px;background:#fff}
@media (prefers-reduced-motion:reduce){.slide,.slide.on,.slide.out{transform:none;transition:opacity 1.2s ease}}
.hero-in{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;padding:28px calc(20px + var(--sr)) 26px calc(20px + var(--sl));max-width:680px;width:100%;margin:0 auto}
.hero-in .hr{display:flex;flex-direction:column}
@media (orientation:landscape) and (min-width:640px){
  .hero-in{max-width:none;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,1fr);column-gap:clamp(24px,4vw,56px);align-items:end;padding-top:24px}
  .hero-in .spacer{display:none}
  .hero-in .hl{align-self:center}
  .hero h2{font-size:clamp(44px,7.5vw,88px)}
}
.hero .when{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h2{font-size:clamp(40px,12vw,64px);line-height:.98;margin:10px 0 10px;font-weight:800;letter-spacing:-.035em;text-shadow:0 2px 24px rgba(var(--tint-rgb),.35)}
.hero .greet{font-size:16px;opacity:.92;margin:0}
.hero .line{font-size:14px;opacity:.8;margin:4px 0 0;font-style:italic}
.glass{background:rgba(var(--deep-rgb),.30);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-radius:18px;padding:14px 16px}
.hero .spacer{flex:1;min-height:30px}
.hero .glass .item{border-top-color:rgba(255,255,255,.18)}
.hero .glass .item .d,.hero .glass .item .t .tm{color:rgba(255,255,255,.75)}
.hero .glass .chk{border-color:#fff}
.hero .glass .item.done .chk{background:#fff}
.hero .glass .item.done .chk svg path{stroke:var(--camelot)}
.hero .glass .item.missed .chk{border-color:#FFB3BC;background:transparent}
.hero .glass .item.missed .chk svg path{stroke:#FFB3BC}
.hero .glass .item.missed .t span:first-child{text-decoration-color:#FFB3BC}
.hero .glass .mtag{color:#FFB3BC}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ghead b{font-size:15px}
.ring{width:42px;height:42px;flex:none}
.stats{display:flex;gap:10px;margin-top:10px}
.stat{flex:1;text-align:left}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;opacity:.8}
.hbtns{display:flex;gap:10px;margin-top:12px}
.hbtn{flex:1;padding:13px;border-radius:14px;font-weight:700;font-size:15px;background:#fff;color:var(--bossa)}
.hbtn.alt{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.gempty{opacity:.85;font-size:14px;padding:4px 0 2px}
.nav h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:18px;flex:none}
.pill{padding:6px 11px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;white-space:nowrap;border:1px solid var(--line)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sub{color:var(--mute);font-size:13px}
.banner{margin:10px calc(14px + var(--sr)) 0 calc(14px + var(--sl));padding:9px 12px;border-radius:10px;background:#fff4d6;color:#6b4e00;font-size:13px}
@media (prefers-color-scheme:dark){.banner{background:#3a3010;color:#ffe08a}}
main{padding:12px calc(14px + var(--sr)) 24px calc(14px + var(--sl))}
.summary{display:flex;gap:10px;align-items:center;margin:0 0 12px}
.bar{flex:1;height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);background-size:200px 100%;border-radius:4px;transition:width .3s}
.week{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:760px){.week{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dh b{font-size:16px}
.dh .tag{font-size:11px;font-weight:700;color:#fff;background:var(--btn);padding:2px 7px;border-radius:999px}
.add{width:30px;height:30px;border-radius:50%;background:var(--soft);font-size:20px;line-height:1;display:grid;place-items:center;color:var(--accent);font-weight:500}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--c,var(--mute));flex:none;display:grid;place-items:center;transition:background .15s}
.chk svg{opacity:0;width:14px;height:14px}
.item.done .chk{background:var(--c,var(--done))}
.item.done .chk svg{opacity:1}
.item .body{flex:1;min-width:0;text-align:left}
.item .t{font-weight:600;display:flex;gap:6px;align-items:baseline}
.item .t .tm{font-weight:500;color:var(--mute);font-size:13px}
.item .d{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .t,.item.done .d{opacity:.5}
.item.missed .chk{border-color:var(--danger)}
.item.missed .chk svg{opacity:1}
.item.missed .t,.item.missed .d{opacity:.55}
.item.missed .t span:first-child{text-decoration:line-through;text-decoration-color:var(--danger);text-decoration-thickness:2px}
.mtag{font-size:11px;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.04em}
.stat-row{display:flex;gap:8px;margin-top:6px}
.stat-row .chip{flex:1;justify-content:center}
.stat-row .chip.on.ms{background:var(--danger);border-color:var(--danger)}
.none{color:var(--mute);font-size:13px;padding:6px 0 4px;display:block;width:100%;text-align:left}
.wfoot{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.month{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mh,.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.mh div{font-size:11px;font-weight:700;color:var(--mute);text-align:center;padding:7px 0;border-bottom:1px solid var(--line)}
.cell{min-height:74px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell:nth-child(7n){border-right:0}
.cell.out{opacity:.35}
.cell .n{font-size:12px;font-weight:700;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cell.today .n{background:var(--accent);color:#fff}
.cell.alldone{background:color-mix(in srgb,var(--sand) 18%,transparent)}
.mi{font-size:10.5px;line-height:1.25;padding:1px 4px;border-radius:4px;background:color-mix(in srgb,var(--c) 18%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.dn{opacity:.5}
.mi.ms{text-decoration:line-through;text-decoration-color:var(--danger);opacity:.6}
.more{font-size:10.5px;color:var(--mute);padding-left:3px}
.libcat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.libcat .lname{font-weight:700;font-size:16px;flex:1;background:transparent;border-color:transparent;padding:6px 8px}
.libcat .lname:focus{background:var(--soft);border-color:var(--accent)}
.swatch{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.libgrp{margin:8px 0 0 4px;padding-left:10px;border-left:3px solid var(--soft)}
.gname{font-weight:700;color:var(--ink);background:transparent;border-color:transparent;padding:4px 6px;flex:1}
.gname:focus{background:var(--soft);border-color:var(--accent);color:var(--ink)}
.x{width:28px;height:28px;border-radius:50%;color:var(--mute);font-size:17px;flex:none;display:grid;place-items:center}
.x.armed{background:var(--danger);color:#fff;width:auto;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.chip.cat{font-weight:650}
.chip.cat i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.chip.cat.on i{background:#fff}
.chip.ed{padding:5px 4px 5px 12px}
.chip.ed .x{width:22px;height:22px;font-size:14px}
.chip.ed .x.armed{width:auto}
.additem{width:120px;padding:6px 10px;border-radius:999px;font-size:14px}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:8px 4px 0}
.newcat{width:100%;padding:12px}
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet{position:relative;background:var(--bg);border-radius:18px 18px 0 0;max-height:90vh;display:flex;flex-direction:column;width:100%;max-width:640px;margin:0 auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.sh-head b{font-size:17px}
.sh-head button{color:var(--accent);font-weight:600}
.sh-body{overflow:auto;padding:6px 16px 16px;-webkit-overflow-scrolling:touch}
.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px}
.sh-foot{display:flex;gap:10px;padding:10px 16px calc(16px + var(--sb));border-top:1px solid var(--line)}
.primary{flex:1;background:var(--btn);color:#fff;border-radius:12px;padding:13px;font-weight:700;font-size:16px}
.primary:disabled{opacity:.4}
.danger{color:var(--danger);font-weight:600;padding:13px 10px}
.danger.armed{background:var(--danger);color:#fff;border-radius:12px;padding:13px 14px}
.dows{display:flex;gap:6px;margin-top:6px}
.dows button{flex:1;height:38px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:13px}
.dows button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:90vw;text-align:center}
.doclist{display:grid;gap:10px}
.doccard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%}
.doccard .ic{width:46px;height:56px;border-radius:8px;flex:none;display:grid;place-items:end start;padding:6px;color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em}
.doccard b{display:block;font-size:16px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 24px;line-height:1.55;font-size:15px}
.doc .doc-title{margin:-18px -18px 18px;padding:22px 18px 18px;border-radius:16px 16px 0 0;background:linear-gradient(120deg,var(--t5),var(--t4) 50%,var(--t3));color:#fff}
.doc .doc-title h1{margin:2px 0 4px;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.doc .kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.doc .lead{margin:0;font-weight:600;opacity:.95}
.doc .meta{margin:8px 0 0;font-size:13px;opacity:.85}
.doc .motto{margin:10px 0 0;font-style:italic;color:var(--hi)}
.doc h2{font-size:19px;margin:26px 0 8px;color:var(--accent);letter-spacing:-.01em}
.doc h3{font-size:16px;margin:20px 0 6px}
.doc h3.wk{padding:8px 12px;border-radius:10px;background:var(--soft);border-left:4px solid var(--terra)}
.doc p{margin:8px 0}
.doc ol{padding-left:22px}
.doc li{margin:6px 0}
.doc .tw{overflow-x:auto;margin:10px -6px;-webkit-overflow-scrolling:touch}
.doc table{border-collapse:collapse;font-size:13px;min-width:560px}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
.doc th{background:var(--soft)}
.doc .term{padding:10px 0;border-bottom:1px solid var(--line)}
.doc .term b{font-size:15px}
.doc .term b.code{display:inline-block;background:var(--btn);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px}
.doc .term p{margin:4px 0 0}
.doc .term .note{color:var(--mute);font-size:14px}
.doc .decode{font-weight:800;font-size:17px;padding:10px 12px;background:var(--soft);border-radius:10px}
.doc .fine{color:var(--mute);font-size:12px;margin-top:20px}
.doclink{color:var(--accent);font-weight:600;font-size:13px;text-transform:none;letter-spacing:0;margin-left:8px}
.tree{margin-top:16px;border-radius:14px;background:color-mix(in srgb,var(--c) 8%,transparent);padding:12px 12px 14px}
.tree-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.tree-head i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.branch{margin:10px 0 0 5px;padding-left:16px;border-left:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.branch .lbl{margin:0;position:relative}
.branch .lbl::before{content:"";position:absolute;left:-16px;top:50%;width:10px;border-top:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.pdfbar{display:flex;align-items:center;margin-bottom:10px}
.pdf{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pdf img{display:block;width:100%;margin:0 0 10px;border-radius:8px;background:#fff;box-shadow:0 1px 6px rgba(43,26,53,.15)}
.pdf.z img{width:230%;max-width:none}
.datarow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ticker{padding:0 var(--sr) 0 var(--sl);display:flex;align-items:center;background:linear-gradient(90deg,var(--tick1),var(--tick2));color:var(--tick-ink);font-size:13px;font-weight:700;height:32px;overflow:hidden}
.ticker .run{flex:1;overflow:hidden;white-space:nowrap;height:100%;display:flex;align-items:center;cursor:pointer;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .run span{display:inline-block;padding-left:100%;animation:tick 16s linear infinite}
.ticker .x{color:var(--tick-ink);width:32px;height:32px;font-size:18px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker .run span{animation:none;padding-left:12px}}
.appfoot{background:var(--deep);color:#E9DCE6;padding:28px calc(22px + var(--sr)) calc(28px + var(--sb)) calc(22px + var(--sl));position:relative}
.appfoot::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.appfoot .fin{max-width:900px;margin:0 auto;display:grid;gap:16px}
.fbrand{display:flex;align-items:center;gap:10px}
.fbrand b{font-size:18px;color:#fff;letter-spacing:-.02em}
.fbrand .logo{width:24px;height:24px;border-radius:8px}
.fbrand .logo::after{inset:7px}
.ftag{margin:2px 0 0;font-style:italic;color:var(--hi);font-size:14px}

<template id="doc-syllabus"><div class="doc-title"><div class="kicker">PHOTOGRAPHY SYLLABUS</div><h1>LIGHT &amp; LENS</h1><p class="lead">8-Week Light Mastery Cycle</p>
<p class="meta">Nikon D7500 / D3400 | 8-Lens Kit | DJI Mini 2 | RAW Workflow</p><p class="motto">The lens serves the light. The light serves the story.</p><p class="meta">Organized by lighting scenario, not by lens.<br>2 long days/week (2-3 hours) | 2-3 short days/week (15-45 min)<br>Editing integrated, not deferred | Drone practice on weekends</p></div><h2 id="course-philosophy">Course Philosophy</h2>
<p>The previous syllabus organized practice by lens. This one organizes by light. The difference matters: a lens rotation teaches you what glass can do. A light rotation teaches you what you can do with any glass in any condition. When you walk into a room, a venue, a landscape, the first question is never 'which lens?' It is 'where is the light, what is it doing, and how do I use it or change it?' The lens choice follows from that answer.</p>
<p><strong>Your voice:</strong> You use light to create tension and narrative. You are drawn to selective illumination, silhouettes, dark negative space, and compositions where the viewer feels what is about to happen. This syllabus is designed to develop that voice while building the technical control to execute it reliably under any lighting condition.</p>
<p><strong>The three pillars:</strong> (1) Light control - reading, shaping, and manipulating light with any tool available. This is the spine. (2) Viewer influence - understanding how composition, framing, and cropping direct emotion and attention. Woven into every assignment. (3) Lens fluency - knowing which lens to grab and why, earned through application under varied conditions rather than isolated rotation.</p>
<h2 id="week-unit-schedule">8-Week Unit Schedule</h2>
<p>Each week presents a lighting scenario. The assignments specify which lenses to use because certain lenses suit certain light. But the focus is the light, not the lens. By the end of the cycle, you will have worked every lens in your kit under the conditions that reveal its strengths and expose its limitations.</p>
<h3 class="wk">Week 1: Window Light &amp; Indoor Natural</h3>
<p><strong>Scenario:</strong> Soft directional light from windows. No artificial sources. Blinds, curtains, and time of day as your only modifiers.</p>
<p><strong>Recommended Lenses:</strong> 50mm f/1.4 (portraits), Tokina 11-16mm (real estate interiors), 105mm Micro (detail/macro near windows)</p>
<p><strong>Composition Focus:</strong> Frame subjects at the edge of light falloff. Place the brightest area where you want the viewer's eye. Practice negative space - let darkness occupy 40-60% of the frame.</p>
<p><strong>Assignment:</strong> Shoot portraits of a person or cat positioned at varying distances from a window. Document how light quality changes as the subject moves 1ft, 3ft, 5ft from the glass. Separately, shoot one room of your house as a real estate interior using only window light - no lamps.</p>
<h3 class="wk">Week 2: Golden Hour &amp; Backlight</h3>
<p><strong>Scenario:</strong> The 45 minutes before sunset. Warm directional light. Backlighting with rim light and flare. The light you will shoot most client work in.</p>
<p><strong>Recommended Lenses:</strong> 50mm f/1.4 (primary), 55-300mm (compressed backlit silhouettes), 35mm f/1.8 (environmental backlit portraits)</p>
<p><strong>Composition Focus:</strong> Backlight separation - place the sun behind your subject and expose for the face. Use lens flare intentionally vs. avoiding it. Frame silhouettes where the shape tells the story without detail.</p>
<p><strong>Assignment:</strong> Shoot a portrait session at golden hour. 3 frames backlit with rim light, 3 frames sidelit, 3 silhouettes. Separately, shoot a landscape at 200-300mm with silhouetted figures against the sunset. Compare how the 50mm and 300mm render the same backlit scene.</p>
<h3 class="wk">Week 3: Harsh &amp; Overhead Light</h3>
<p><strong>Scenario:</strong> Midday sun, direct overhead, hard shadows. The light most photographers avoid. You learn to use it or find shade within it.</p>
<p><strong>Recommended Lenses:</strong> 35mm f/1.8 (street), 18-55mm kit zoom (versatility), Tokina 11-16mm (architecture shadows)</p>
<p><strong>Composition Focus:</strong> Use shadows as compositional elements, not problems. Shadow lines as leading lines. Contrast between lit and unlit areas to direct attention. Hard light on texture (brick, concrete, bark).</p>
<p><strong>Assignment:</strong> Shoot 10 frames where the shadow is the subject, not the object casting it. Shoot a portrait in open shade with harsh sun 2 feet behind the shade line - expose for the face, let the background blow. Shoot one architectural subject where the shadow pattern is more interesting than the building.</p>
<h3 class="wk">Week 4: Overcast &amp; Diffused Light</h3>
<p><strong>Scenario:</strong> Flat, even light. No shadows. No drama from the sky. The challenge is creating mood when nature gives you none. Also the most flattering portrait light.</p>
<p><strong>Recommended Lenses:</strong> 50mm f/1.4 (portraits - use aperture for depth separation since light will not help), 105mm Micro (macro - overcast is ideal for detail work), Laowa 100mm 2:1 (extreme macro)</p>
<p><strong>Composition Focus:</strong> Without light contrast to guide the eye, composition carries everything. Color contrast, texture contrast, and subject isolation through depth of field become your tools. Practice minimalism - fewer elements, stronger statement.</p>
<p><strong>Assignment:</strong> Shoot a portrait session on an overcast day. Make the images feel moody despite flat light through composition and aperture choices alone. Separately, shoot macro work outdoors - overcast eliminates harsh reflections on small subjects. 10 frames with each macro lens, compare 1:1 vs 2:1 magnification.</p>
<h3 class="wk">Week 5: Low Light &amp; Night</h3>
<p><strong>Scenario:</strong> After sunset, indoor dim conditions, street lights, moonlight. High ISO territory. Tripod mandatory. This is where your camera's limits become real.</p>
<p><strong>Recommended Lenses:</strong> 50mm f/1.4 (fastest glass, lowest ISO needed), 35mm f/1.8 (street at night), 200-500mm f/5.6 (moon, astrophotography), Tokina 11-16mm f/2.8 (night sky wide field)</p>
<p><strong>Composition Focus:</strong> Light sources become subjects - street lamps, windows, car lights, the moon. Frame around points of light in darkness. Use long exposure to create light trails and star movement. Isolate illuminated subjects against dark negative space.</p>
<p><strong>Assignment:</strong> Shoot a cityscape or street scene after dark with the 35mm - use available light only, push ISO and find your camera's noise ceiling. Separately, shoot the moon at 500mm on a tripod. Shoot a 20-second exposure of the night sky with the Tokina. Three completely different approaches to darkness in one session.</p>
<h3 class="wk">Week 6: Mixed &amp; Artificial Light</h3>
<p><strong>Scenario:</strong> Indoor scenes with multiple light sources at different color temperatures. Tungsten lamps, LED overhead, daylight from windows, all in one frame. The hardest white balance scenario.</p>
<p><strong>Recommended Lenses:</strong> Tokina 11-16mm (real estate - this is the exact scenario you face in every property), 50mm f/1.4 (indoor portraits under mixed light), 18-55mm kit zoom (versatility for problem-solving)</p>
<p><strong>Composition Focus:</strong> Identify the dominant light source and expose for it. Accept that mixed light means some areas will be warm and some cool - use that contrast intentionally rather than fighting it.</p>
<p><strong>Assignment:</strong> Shoot a full real estate walkthrough of your house with every light on and every blind open. Set Kelvin manually and keep it consistent across all rooms. Separately, shoot a portrait under mixed lighting - one side of the face lit by warm lamp, other side by cool window. Make it look intentional, not accidental.</p>
<h3 class="wk">Week 7: Practical &amp; Creative Light</h3>
<p><strong>Scenario:</strong> You provide the light. Phone flashlight, headlamp, candles, colored materials, reflectors, speedlight. This is your voice week - dark mood, selective illumination, narrative tension.</p>
<p><strong>Recommended Lenses:</strong> 50mm f/1.4 (portraits with dramatic practical light), 105mm Micro (illuminated details), 35mm f/1.8 (environmental scenes with creative lighting)</p>
<p><strong>Composition Focus:</strong> Light only what matters. Let everything else fall to darkness. The viewer's eye goes where the light is - use that to tell a story. Practice light painting with long exposures. Color cast from materials to set mood.</p>
<p><strong>Assignment:</strong> Pre-visualize 5 specific frames before touching the camera. Set each one up deliberately - choose the light position, the color, the exposure time. Separately, shoot a portrait lit only by a single practical light source (lamp, candle, phone). Make it feel cinematic, not accidental.</p>
<h3 class="wk">Week 8: Client Simulation &amp; Field Test</h3>
<p><strong>Scenario:</strong> No controlled conditions. You show up, assess the light, choose the lens, solve problems in real time. This week tests everything from weeks 1-7 under pressure.</p>
<p><strong>Recommended Lenses:</strong> Bring your full kit. Choose the right lens for each scenario without being told which one to use.</p>
<p><strong>Composition Focus:</strong> Apply everything. Every frame should demonstrate a deliberate lighting choice, a deliberate composition choice, and a deliberate lens choice. If you cannot articulate all three before pressing the shutter, do not press it.</p>
<p><strong>Assignment:</strong> Three assignments: (1) Shoot a portrait session with a willing subject - direct them, manage the light, deliver 15-20 edited frames. (2) Shoot a complete real estate walkthrough of a property you have not previously photographed. (3) Shoot one creative personal project applying your voice - moody, narrative, tension-driven. Review all three sets and self-assess.</p>
<h2 id="weekly-structure">Weekly Structure</h2>
<p>You have two long days (2-3 hours each) and two to three short days (15-45 minutes each) per week. Editing is integrated into the schedule, not saved for Sunday. The backlog problem from the previous cycle ends here.</p>

<h3>The Backlog Rule</h3>
<p>If you have more than two unprocessed shooting sessions, your next session is an edit session, not a shooting session. No exceptions. Shooting without reviewing is collecting data you never learn from. The feedback loop between shooting and editing is where skill compounds. Break the loop and you are just accumulating hard drive clutter.</p>
<h3>Drone Practice</h3>
<p>DJI Mini 2. Weekend long days only, 20-30 minutes per session. Focus on smooth flight, composition from altitude, and understanding how aerial perspective changes the relationship between foreground, midground, and background. Log every flight. Part 107 certification is in progress - until it is complete, no commercial use of aerial footage.</p>

<h2 id="real-estate-integration">Real Estate Integration</h2>
<p>Real estate photography is not a separate practice track. It is embedded in the weekly units where it belongs. Weeks 1, 3, 6, and 8 contain dedicated real estate assignments because those weeks present the lighting conditions you will encounter in actual property shoots: window light (Week 1), harsh contrast between interior and exterior (Week 3), mixed artificial and natural sources (Week 6), and the full simulation (Week 8).</p>
<p><strong>Standard real estate settings:</strong> Tokina 11-16mm at f/7.1-f/9. Manual mode. ISO 100. Tripod at chest height. Manual Kelvin white balance locked for the entire property. HDR bracketing (-2, 0, +2) for rooms with bright windows. Virtual horizon on. Shoot from corners. Three walls visible. Stage before shooting.</p>
<p>By the end of one 8-week cycle, you will have shot your own house under four different lighting conditions. By cycle two, you should be shooting other properties.</p>
<h2 id="pre-session-protocol">Pre-Session Protocol</h2>
<p>Before every shoot, answer these five questions. If you cannot answer all five, you are not ready to press the shutter.</p>
<ol type="1">
<li><p><strong>What is the light doing?</strong> Direction, quality (hard/soft), color temperature. Read it before raising the camera.</p></li>
<li><p><strong>What story am I telling?</strong> What should the viewer feel when they see this frame? Name the emotion or narrative before composing.</p></li>
<li><p><strong>Why this lens?</strong> Articulate why the lens on your camera right now is the right tool for this light and this story. If you cannot, switch.</p></li>
<li><p><strong>What is in the background?</strong> Check behind your subject before pressing the shutter. Move if something competes with or distracts from your story.</p></li>
<li><p><strong>What settings and why?</strong> Aperture, shutter, ISO. Each one should be a deliberate decision, not a default. If you are in auto-anything, know why.</p></li>
</ol>
<h2 id="progression-milestones">Progression Milestones</h2>
<h3>Cycle 1 Complete (Week 8)</h3>
<p>You can walk into any lighting scenario and identify the dominant light source, its direction, and its quality within 15 seconds. You know which lens to grab for each commercial scenario without deliberating. You can produce a consistent set of real estate images under mixed lighting. Your portrait work in golden hour is reliable. You have a growing body of personal work that reflects your voice - moody, narrative, tension-driven. Your editing backlog never exceeds two sessions.</p>
<h3>Cycle 2 Complete (Week 16)</h3>
<p>You can shape light, not just read it. Speedlight on camera and off camera is comfortable. You can manage a full portrait session directing a subject through poses, locations, and lighting changes. Your real estate work is consistent enough to show agents. Your drone footage is composed and smooth. Part 107 is complete. Your portfolio has enough depth to support a website launch.</p>
<h3>Cycle 3 Complete (Week 24)</h3>
<p>You are booking paid work. Engagement sessions, real estate listings, or second-shooting weddings. The camera and lighting decisions are invisible to you during a shoot - all of your attention is on the subject and the story. Your voice is recognizable across your portfolio. You are a photographer, not someone who owns a camera.</p>
<h2 id="final-note">Final Note</h2>
<p>The first syllabus taught you how to operate a camera. This one teaches you how to see. The difference between a technician and a photographer is that the technician executes settings and the photographer tells stories. You have the technical foundation. Now the work is learning to control the single most important variable in every photograph: light.</p>
<p><strong>The lens is the instrument. Light is the music. Learn to hear it.</strong></p>

<template id="doc-nikkor"><div class="doc-title"><div class="kicker">Nikon</div><h1>NIKKOR Lens Nomenclature</h1><p class="lead">F-Mount Designation Reference</p></div><h2>Your Lenses Decoded</h2><div class="term"><b>AF-S NIKKOR 200-500mm f/5.6E ED VR</b><p>In-lens AF motor. FX format. 200-500mm zoom range. f/5.6 constant aperture. Electronic diaphragm (E). Extra-low dispersion glass. Vibration Reduction stabilization. No aperture ring.</p></div><div class="term"><b>AF-S NIKKOR 50mm f/1.4G</b><p>In-lens AF motor. FX format. 50mm prime. f/1.4 fast aperture. No aperture ring (G). On your DX body, acts like a 75mm portrait lens.</p></div><div class="term"><b>AF-S DX NIKKOR 35mm f/1.8G</b><p>In-lens AF motor. DX crop format - designed for your sensor. 35mm prime. f/1.8 fast aperture. No aperture ring. On DX, acts like a 52.5mm normal lens.</p></div><div class="term"><b>AF-P DX NIKKOR 18-55mm f/3.5-5.6G VR</b><p>Stepping motor AF (quiet, fast). DX format kit lens. Variable aperture zoom: f/3.5 at 18mm, f/5.6 at 55mm. No aperture ring. VR stabilization.</p></div><div class="term"><b>Tokina atx-i 11-16mm f/2.8 CF</b><p>Third-party (Tokina). DX ultra-wide zoom. Constant f/2.8 aperture. CF = Compact Focus. Uses body screw-drive AF motor - works on D7500.</p></div><div class="term"><b>AF NIKKOR 50mm f/1.8D</b><p>Body screw-drive AF (no in-lens motor). FX format. 50mm prime. f/1.8 aperture. D-type: has aperture ring + sends distance data. The &quot;nifty fifty&quot; classic.</p></div><h2>Quick Decision Guide</h2><div class="term"><b class="code">D vs G vs E</b><p>D has an aperture ring (lock it at smallest number). G removed the ring. E added electronic control for faster, more precise operation. Evolution: D -&gt; G -&gt; E.</p></div><div class="term"><b class="code">AF vs AF-S</b><p>Both are F-mount. AF relies on a motor in the camera body (shaft-driven). AF-S has its own motor - quieter, faster, works on every body including entry-level.</p></div><div class="term"><b class="code">DX on FX</b><p>Usable in DX crop mode (body auto-detects). You get fewer megapixels. FX on DX always works - you just use the center of the image circle.</p></div><h2>Focus Motor &amp; Mount Type</h2><div class="term"><b class="code">AI / AI-S</b><p>Manual focus. Mechanical aperture coupling to body meter. AI-S adds linear aperture response for program/shutter-priority modes.</p><p class="note">No autofocus. Aperture ring on lens.</p></div><div class="term"><b class="code">AF</b><p>Autofocus driven by the camera body&#x27;s screw-drive motor (via the coupling shaft in the mount). Requires a body with a built-in AF motor.</p><p class="note">D7500 has a body motor - these lenses will autofocus on it. Entry-level bodies (D3x00/D5x00) do not.</p></div><div class="term"><b class="code">AF-S</b><p>Silent Wave Motor built into the lens. Full-time manual focus override - turn the ring anytime without switching to M. Autofocuses on all Nikon bodies.</p><p class="note">Most common modern F-mount designation. Still F-mount, not a separate mount.</p></div><div class="term"><b class="code">AF-P</b><p>Stepping motor. Smoother, quieter, faster - optimized for video AF. Requires newer bodies for full menu control.</p><p class="note">D7500 fully compatible. Found on newer kit lenses (10-20mm, 18-55mm, 70-300mm).</p></div><div class="term"><b class="code">AF-I</b><p>Predecessor to AF-S. Internal coreless motor. Rare - only a few long telephoto lenses used this before AF-S replaced it.</p><p class="note">Obsolete. You won&#x27;t encounter these unless buying vintage superteles.</p></div><h2>Sensor Format</h2><div class="term"><b class="code">DX</b><p>Designed for crop-sensor bodies (23.5x15.6mm, 1.5x crop factor). Smaller image circle - will vignette heavily on full-frame bodies.</p><p class="note">Your D7500 is a DX body. DX lenses are native to it.</p></div><div class="term"><b class="code">FX</b><p>Designed for full-frame (36x24mm). Larger image circle covers both FX and DX sensors. On DX, the center is cropped, giving the 1.5x reach bonus.</p><p class="note">Your 50mm f/1.4 and 200-500mm f/5.6E are FX lenses working on your DX body.</p></div><h2>Aperture Control Type</h2><div class="term"><b class="code">D</b><p>Sends distance information to the body for 3D Matrix Metering and i-TTL flash. Has a physical aperture ring on the lens barrel.</p><p class="note">Set the ring to the smallest number (highest f-stop) and lock it - control aperture from the camera body dial.</p></div><div class="term"><b class="code">G</b><p>No aperture ring. Aperture is controlled entirely through the camera body command dial. Also sends distance data like D-type.</p><p class="note">The &quot;G&quot; effectively replaced the &quot;D&quot; designation. Most modern F-mount lenses are G-type.</p></div><div class="term"><b class="code">E</b><p>Electronic aperture control (electromagnetic diaphragm). No mechanical aperture lever - the body controls the aperture electronically via contacts.</p><p class="note">Found on newer pro lenses. Your 200-500mm f/5.6E uses this. More precise aperture control during bursts.</p></div><h2>Optical Element Codes</h2><div class="term"><b class="code">ED</b><p>Extra-low Dispersion glass. Reduces chromatic aberration (color fringing), especially at telephoto focal lengths.</p><p class="note">Very common on telephoto and zoom lenses. Look for this on anything over 70mm.</p></div><div class="term"><b class="code">FL</b><p>Fluorite lens element. Even lower dispersion than ED with less weight. Premium optical element found on high-end telephotos.</p><p class="note">Lighter than ED at the same correction quality. Seen on 500mm f/5.6E PF, 800mm f/5.6E FL.</p></div><div class="term"><b class="code">ASP</b><p>Aspherical lens element. Corrects spherical aberration and distortion, especially in wide-angle and wide-aperture lenses.</p><p class="note">Allows sharper performance with fewer total elements, keeping the lens lighter.</p></div><div class="term"><b class="code">N</b><p>Nano Crystal Coat. Nikon&#x27;s premium anti-reflective coating. Dramatically reduces ghosting and flare from point light sources.</p><p class="note">Found on pro-grade lenses. Gold &quot;N&quot; badge on the lens barrel.</p></div><div class="term"><b class="code">IF</b><p>Internal Focusing. The lens does not change physical length during focus. The front element stays stationary.</p><p class="note">Important for filters (polarizers won&#x27;t spin) and macro work (won&#x27;t bump the subject). Faster AF, better balance.</p></div><div class="term"><b class="code">RF</b><p>Rear Focusing. Focus group is at the back of the lens. Similar benefits to IF - fast, compact focus travel.</p><p class="note">Less common designation. Mostly seen on older AF tele lenses.</p></div><div class="term"><b class="code">CRC</b><p>Close-Range Correction. Floating element design optimizes sharpness at close focus distances, not just infinity.</p><p class="note">Found on some wide-angles and macro lenses. Improves near-subject performance.</p></div><div class="term"><b class="code">DC</b><p>Defocus Control. A ring on the lens controls the quality (not amount) of background or foreground blur.</p><p class="note">Only on 105mm f/2 DC and 135mm f/2 DC. Niche portrait lenses.</p></div><div class="term"><b class="code">PF</b><p>Phase Fresnel element. Uses diffraction to correct chromatic aberration instead of heavy ED/FL glass. Dramatically reduces size and weight.</p><p class="note">The 300mm f/4E PF and 500mm f/5.6E PF are remarkably portable superteles because of this.</p></div><h2>Stabilization</h2><div class="term"><b class="code">VR</b><p>Vibration Reduction. Optical image stabilization - a gyro-sensor detects shake and a floating lens group compensates in real time.</p><p class="note">Typically gives 3-4 stops of handheld advantage. Critical for telephoto, useful for video.</p></div><div class="term"><b class="code">VR II</b><p>Second-generation VR system. Improved stabilization performance - usually rated at 4+ stops of correction.</p><p class="note">Found on newer telephoto zooms like the 70-200mm f/2.8E FL ED VR.</p></div><h2>Specialty Designations</h2><div class="term"><b class="code">Micro</b><p>Nikon&#x27;s term for macro. Capable of at least 1:1 reproduction ratio (life-size on the sensor). Optimized for close-focus sharpness.</p><p class="note">Nikon says &quot;Micro&quot; where everyone else says &quot;Macro.&quot; Same thing.</p></div><div class="term"><b class="code">PC-E</b><p>Perspective Control with Electronic aperture. Tilt-shift lens for architecture and product photography. Corrects converging verticals.</p><p class="note">Manual focus only. Used in real estate and architectural work to keep buildings straight.</p></div><div class="term"><b class="code">TC</b><p>Teleconverter. Multiplies focal length (1.4x, 1.7x, or 2x) at the cost of light loss and some sharpness. Mounts between body and lens.</p><p class="note">TC-14E III (1.4x, loses 1 stop), TC-20E III (2x, loses 2 stops). Only works with certain AF-S/AF-I teles.</p></div><h2>Decoded Example</h2><p class="decode">AF-S VR Micro-NIKKOR 105mm f/2.8G IF-ED</p><div class="term row2"><b class="code">AF-S</b><p>Silent Wave Motor - in-lens AF, works on all bodies</p></div><div class="term row2"><b class="code">VR</b><p>Vibration Reduction optical stabilization</p></div><div class="term row2"><b class="code">Micro</b><p>Macro lens - 1:1 life-size reproduction</p></div><div class="term row2"><b class="code">105mm</b><p>Focal length (157.5mm equivalent on DX)</p></div><div class="term row2"><b class="code">f/2.8</b><p>Maximum aperture - how wide the diaphragm opens</p></div><div class="term row2"><b class="code">G</b><p>No aperture ring - body dial controls aperture</p></div><div class="term row2"><b class="code">IF</b><p>Internal Focusing - length stays fixed, front won&#x27;t spin</p></div><div class="term row2"><b class="code">ED</b><p>Extra-low Dispersion glass - reduces color fringing</p></div><p class="fine">NIKKOR &amp; Nikon are trademarks of Nikon Corporation. Reference compiled for personal use.</p></template>

  for(const id of [...dirty]){
    if(inflight.has(id))continue;
    dirty.delete(id);inflight.add(id);
    const body=clone(id==='library'?S.lib:id==='meta'?S.meta:id==='photos'?S.photos:S.months[id]);
    try{await save(id,body)}
    catch(e){
      if(e&&e.code==='unavailable'){dirty.add(id);setTimeout(flush,1500+Math.random()*1000)}
      else if(e&&e.code==='quota_exceeded')toast('Storage is full. Delete old items to keep saving.');
      else toast("Couldn't save that change. Try again.");
    }
    finally{inflight.delete(id);if(dirty.has(id)){clearTimeout(flushT);flushT=setTimeout(flush,350)}}
  }
}
async function save(id,body){
  if(mode==='db')return db.doc(`data/users/${me}/${id}`).set(body);
  try{localStorage.setItem('daybook:doc:'+id,JSON.stringify(body))}catch(e){}
}
function loadLocal(){
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k.startsWith('daybook:doc:'))continue;
    const id=k.slice(12),v=JSON.parse(localStorage.getItem(k));if(id==='library'){S.lib=migrate(v);if(upgrade(S.lib))markDirty('library')}else if(id==='meta')S.meta=v;else if(id==='photos')S.photos=v;else S.months[id]=v}}catch(e){}
}

async function init(){
  render();
  const c=window.claude;
  if(c&&c.use){
    try{db=await c.use('db')}catch(e){db=null}
    try{const u=await c.use('user');me=u?await u.id():null}catch(e){me=null}
    try{ASSETS=await c.use('assets')}catch(e){ASSETS=null}
  }
  if(db&&me){
    mode='db';
    const loadT=setTimeout(()=>{if(!S.ready){S.ready=true;render()}banner("Can't reach your saved schedule yet. Showing what's on this device.")},10000);
    db.collection(`data/users/${me}`).onSnapshot(snap=>{
      let changed=false;
      for(const d of snap.docs){
        if(dirty.has(d.id)||inflight.has(d.id))continue;
        const v=d.data();if(!v)continue;
        const cur=d.id==='library'?S.lib:d.id==='meta'?S.meta:d.id==='photos'?S.photos:S.months[d.id];
        if(cur&&JSON.stringify(cur)===JSON.stringify(v))continue;
        changed=true;
        if(d.id==='library'){S.lib=migrate(clone(v));if(upgrade(S.lib))markDirty('library')}else if(d.id==='meta')S.meta=clone(v);else if(d.id==='photos'){S.photos=clone(v);setTimeout(refreshSlides)}else if(d.id.startsWith('m-'))S.months[d.id]=clone(v);
      }
      if(!snap.metadata.fromCache){clearTimeout(loadT);banner('')}
      const first=!S.ready;S.ready=true;
      if(first||changed){if(isTyping())pendingRender=true;else{render();if(S.sheet&&S.sheet.type==='day')drawSheet()}}
    },err=>{clearTimeout(loadT);S.ready=true;render();banner('Sync stopped. Reopen the page to reconnect.')});
  }else{
    mode='local';loadLocal();S.ready=true;
    banner('Saving on this device only. Open from claude.ai while signed in to sync across devices.');
    render();
  }
}

async function shrink(file){

  const w=src.width,h=src.height,sc=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);

}

function readInputs(){const s=S.sheet;if(!s||s.type!=='edit')return;const t=$('#f-time'),n=$('#f-note'),w=$('#f-weeks'),mo=$('#f-months');if(mo)s.months=+mo.value;

/* ---------- series helpers ---------- */
function sameSeries(a,b){if(a.series||b.series)return !!a.series&&a.series===b.series;
  return a.cat===b.cat&&(a.time||'')===(b.time||'')&&(a.note||'')===(b.note||'')&&(a.picks||[]).join('|')===(b.picks||[]).join('|')}
function futureOf(orig,fromK){const out=[];
  for(const m of Object.values(S.months))for(const [k,arr] of Object.entries(m.days||{}))if(k>fromK)for(const e of arr)if(e.id!==orig.id&&sameSeries(orig,e))out.push(k);
  return out}
function applyFuture(orig,fromK,fn){const keys=[...new Set(futureOf(orig,fromK))];
  for(const k of keys)setDay(k,getDay(k).flatMap(e=>e.id!==orig.id&&sameSeries(orig,e)?fn(e):[e]));return keys.length}
function saveEntry(){
  readInputs();const s=S.sheet,cat=catById(s.cat);
  const order=cat?cat.groups.flatMap(g=>g.items):[];
  const picks=[...order.filter(x=>s.picks.has(x)),...[...s.picks].filter(x=>!order.includes(x))];
  const base={cat:s.cat,catName:cat?cat.name:s.ghost.name,color:cat?cat.color:s.ghost.color,picks,note:s.note,time:s.time};
  if(s.id){
    const orig=getDay(s.k).find(e=>e.id===s.id);
    setDay(s.k,getDay(s.k).map(e=>e.id===s.id?{...e,...base,done:s.status==='done',missed:s.status==='missed'}:e));
    if(orig&&s.scope==='future'){const n=applyFuture(orig,s.k,e=>[{...e,...base}]);if(n)toast(`Updated this and ${n} future`)}
  }else{
    const startD=parse(s.k),mon=mondayOf(startD);let count=0;
    if((s.rmode==='monthly'&&s.months>1)||(s.rmode!=='monthly'&&(s.weeks>1||s.dows.size>1)))base.series=rid();
    if(s.rmode==='monthly'){const day=startD.getDate();
      for(let m=0;m<s.months;m++){const y=startD.getFullYear(),mm=startD.getMonth()+m,last=new Date(y,mm+1,0).getDate();
        const isLast=day===new Date(startD.getFullYear(),startD.getMonth()+1,0).getDate(),useLast=isLast&&s.mday==='last';
        const k=keyOf(new Date(y,mm,useLast?last:Math.min(day,last)));setDay(k,[...getDay(k),{id:rid(),...base,done:false}]);count++}
    }else
    for(let w=0;w<s.weeks;w++)for(const i of [...s.dows].sort()){
      const d=addDays(mon,w*7+i);if(d<startD)continue;
      const k=keyOf(d);setDay(k,[...getDay(k),{id:rid(),...base,done:false}]);count++;
    }
    if(count>1)toast(`Added ${count} times`);
  }
  const back=s.back,k=s.k;
  if(back==='day')S.sheet={type:'day',k};else S.sheet=null;
  drawSheet();render();
}

async function exportIcs(){
  let days=[];
  if(S.view==='week'){const s=mondayOf(S.anchor);for(let i=0;i<(S.five?5:7);i++)days.push(keyOf(addDays(s,i)))}
  else{const a=S.anchor,n=new Date(a.getFullYear(),a.getMonth()+1,0).getDate();for(let i=1;i<=n;i++)days.push(keyOf(new Date(a.getFullYear(),a.getMonth(),i)))}
  const ie=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const now=new Date(),stamp=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Daybook//EN','CALSCALE:GREGORIAN'];let n=0;
  for(const k of days)for(const e of getDay(k)){
    if(e.done||e.missed)continue;n++;
    const v=view(e),ymd=k.replace(/-/g,'');
    L.push('BEGIN:VEVENT',`UID:${e.id}@daybook`,`DTSTAMP:${stamp}`,`SUMMARY:${ie(v.name+(e.picks&&e.picks.length?': '+e.picks.join(', '):''))}`);
    if(e.note)L.push(`DESCRIPTION:${ie(e.note)}`);
    if(e.time){const[h,m]=e.time.split(':').map(Number);const end=new Date(2000,0,1,h,m+45);
      L.push(`DTSTART:${ymd}T${pad(h)}${pad(m)}00`,`DTEND:${ymd}T${pad(end.getHours())}${pad(end.getMinutes())}00`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${ie(v.name)}`,'TRIGGER:-PT15M','END:VALARM');}
    else{L.push(`DTSTART;VALUE=DATE:${ymd}`,`DTEND;VALUE=DATE:${keyOf(addDays(parse(k),1)).replace(/-/g,'')}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${ie(v.name)}`,'TRIGGER:PT8H','END:VALARM');}
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  if(!n){toast('Nothing open to send in this view');return}
  const text=L.join('\r\n');
  let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:S.view==='week'?'daybook-week.ics':'daybook-month.ics',data:text});toast('Open the file to add it to your calendar');return}catch(e){toast('Download cancelled');return}}
  try{await navigator.clipboard.writeText(text);toast('Calendar file copied')}catch(e){toast('Downloads are not available here')}
}

/* ---------- backup / restore ---------- */
async function backup(){
  const data=JSON.stringify({app:'daybook',format:1,saved:new Date().toISOString(),library:lib(),months:S.months,photos:S.photos||null});
  let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  const done=()=>{S.meta={...(S.meta||{}),lastBackup:todayKey()};markDirty('meta');renderTicker()};
  if(dl){try{await dl.save({filename:`daybook-backup-${todayKey()}.json`,data});done();toast('Backup saved')}catch(e){toast('Backup cancelled')}return}
  try{await navigator.clipboard.writeText(data);done();toast('Backup copied to clipboard')}catch(e){toast('Downloads are not available here')}
}
function applyRestore(){
  const o=S.pendingRestore;if(!o)return;S.pendingRestore=null;
  S.lib=migrate(clone(o.library));upgrade(S.lib);markDirty('library');
  for(const id of Object.keys(S.months))if(!o.months[id]){S.months[id]={days:{}};markDirty(id)}
  for(const [id,m] of Object.entries(o.months))if(/^m-\d{4}-\d{2}$/.test(id)){S.months[id]=clone(m);markDirty(id)}
  if(o.photos){S.photos=clone(o.photos);markDirty('photos');refreshSlides()}
  toast('Backup restored');render();
}

/* ---------- interactions ---------- */
let armedEl=null,armT=null;
function arm(el,label){ // two-tap confirm
  if(armedEl===el){clearTimeout(armT);armedEl=null;return true}
  if(armedEl){armedEl.classList.remove('armed');armedEl.innerHTML=armedEl.dataset.orig}
  el.dataset.orig=el.innerHTML;el.classList.add('armed');el.textContent=label;armedEl=el;
  clearTimeout(armT);armT=setTimeout(()=>{if(armedEl===el){el.classList.remove('armed');el.innerHTML=el.dataset.orig;armedEl=null}},3000);
  return false;
}
function toast(m){const t=$('#toast');t.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',2200)}
function libChanged(){markDirty('library');render()}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,k=b.dataset.k,ds=b.dataset;
  if(armedEl&&armedEl!==b){armedEl.classList.remove('armed');armedEl.innerHTML=armedEl.dataset.orig;armedEl=null}
  switch(a){
    case 'view':if(ds.v==='docs'&&S.view==='docs')S.doc=null;if(ds.v==='lib'&&S.view==='lib')S.editSec=null;S.view=ds.v;savePrefs();render();APP.scrollTo(0,0);if(S.view==='week')setTimeout(scrollToday,150);break;
    case 'five':S.five=!S.five;savePrefs();render();break;
    case 'today':S.anchor=new Date();render();scrollToday();break;
    case 'prev':case 'next':{const dir=a==='next'?1:-1;
      S.anchor=S.view==='week'?addDays(S.anchor,7*dir):new Date(S.anchor.getFullYear(),S.anchor.getMonth()+dir,1);render();break}
    case 'new':readInputs();openEditor(k,null,ds.back);break;
    case 'edit':{const e=getDay(k).find(x=>x.id===ds.id);if(e)openEditor(k,e,S.sheet&&S.sheet.type==='day'?'day':null);break}
    case 'toggle':{let msg='';setDay(k,getDay(k).map(e=>{if(e.id!==ds.id)return e;
        if(!e.done&&!e.missed)return{...e,done:true,missed:false};
        if(e.done){msg='Marked missed · tap again to reopen';return{...e,done:false,missed:true}}
        return{...e,done:false,missed:false}}));if(msg)toast(msg);render();if(S.sheet&&S.sheet.type==='day')drawSheet();break}
    case 'day':S.sheet={type:'day',k};drawSheet();break;
    case 'close':{const s=S.sheet;if(s&&s.type==='edit'&&s.back==='day'){S.sheet={type:'day',k:s.k}}else S.sheet=null;drawSheet();break}
    case 'pickcat':readInputs();if(S.sheet.cat!==ds.id){S.sheet.cat=ds.id;S.sheet.picks=new Set();S.sheet.ghost=null}drawSheet();break;
    case 'pick':{readInputs();const it=catById(S.sheet.cat).groups[+ds.g].items[+ds.i];S.sheet.picks.has(it)?S.sheet.picks.delete(it):S.sheet.picks.add(it);drawSheet();break}
    case 'dow':readInputs();{const i=+ds.i,s=S.sheet.dows;s.has(i)?s.delete(i):s.add(i);if(!s.size)s.add(i)}drawSheet();break;
    case 'cleartime':S.sheet.time='';{const t=$('#f-time');if(t)t.value=''}break;
    case 'save':saveEntry();break;
    case 'scope':readInputs();S.sheet.scope=ds.v;drawSheet();break;
    case 'mday':readInputs();S.sheet.mday=ds.v;drawSheet();break;
    case 'rmode':readInputs();S.sheet.rmode=ds.v;drawSheet();break;
    case 'status':readInputs();S.sheet.status=ds.v;drawSheet();break;
    case 'delentry':if(arm(b,'Tap again to delete')){const s=S.sheet,orig=getDay(s.k).find(e=>e.id===s.id);
      if(orig&&s.scope==='future'){const n=applyFuture(orig,s.k,()=>[]);if(n)toast(`Deleted this and ${n} future`)}
      setDay(s.k,getDay(s.k).filter(e=>e.id!==s.id));
      if(s.back==='day')S.sheet={type:'day',k:s.k};else S.sheet=null;drawSheet();render()}break;
    case 'copyweek':{const s=mondayOf(S.anchor);let n=0;
      const hasAny=[0,1,2,3,4,5,6].some(i=>getDay(keyOf(addDays(s,i))).length);
      if(hasAny&&!arm(b,'This week has items. Tap again to add anyway'))break;
      for(let i=0;i<7;i++){const src=getDay(keyOf(addDays(s,i-7)));if(!src.length)continue;const k2=keyOf(addDays(s,i));
        setDay(k2,[...getDay(k2),...src.map(e=>({...e,id:rid(),done:false,missed:false,series:undefined}))]);n+=src.length}
      toast(n?`Copied ${n} items`:'Last week was empty');render();break}
    case 'export':exportIcs();break;
    case 'color':{const c=lib().cats[+ds.c];c.slot=((typeof c.slot==='number'?c.slot:nearestSlot(c.color))+1)%PALETTE.length;c.color=PALETTE[c.slot];libChanged();break}
    case 'delcat':if(arm(b,'Delete?')){lib().cats.splice(+ds.c,1);libChanged()}break;
    case 'delgrp':if(arm(b,'Delete?')){lib().cats[+ds.c].groups.splice(+ds.g,1);libChanged()}break;
    case 'mvcat':case 'mvgrp':{const L=lib(),arr=a==='mvcat'?L.cats:L.cats[+ds.c].groups,i=+(a==='mvcat'?ds.c:ds.g),j=i+(+ds.d);
      if(j<0||j>=arr.length)break;[arr[i],arr[j]]=[arr[j],arr[i]];S.editItem=null;libChanged();break}
    case 'opencat':{const O=S.openCats||(S.openCats=new Set());O.has(ds.id)?O.delete(ds.id):O.add(ds.id);render();break}
    case 'opengrp':{const O=S.openGrps||(S.openGrps=new Set());O.has(ds.k)?O.delete(ds.k):O.add(ds.k);render();break}
    case 'libtoggleall':{const O=S.openCats||(S.openCats=new Set());if(O.size){O.clear();S.openGrps&&S.openGrps.clear()}else lib().cats.forEach(c=>O.add(c.id));render();break}
    case 'esec':S.editSec=ds.v;render();APP.scrollTo(0,0);break;
    case 'eback':S.editSec=null;render();APP.scrollTo(0,0);break;
    case 'openthemes':S.openThemes=!S.openThemes;render();break;
    case 'tholiday':{S.meta={...(S.meta||{})};S.meta.holidayThemes=S.meta.holidayThemes===false;markDirty('meta');render();break}
    case 'tseason':{S.meta={...(S.meta||{})};const se={...(S.meta.seasons||{})};se[ds.v]=!se[ds.v];S.meta.seasons=se;markDirty('meta');render();break}
    case 'tpreview':S.preview=ds.v||null;render();break;
    case 'openphotos':S.openPhotos=!S.openPhotos;S.photoSel=null;render();break;
    case 'palbum':photos().active=ds.v;markDirty('photos');render();refreshSlides();break;
    case 'pzoom':{const P=photos();P.zoom=P.zoom===false;markDirty('photos');render();refreshSlides();break}
    case 'psel':S.photoSel=S.photoSel===ds.id?null:ds.id;render();break;
    case 'pcrop':{const p=photos().photos.find(x=>x.id===S.photoSel);if(p){p.x=+ds.v;markDirty('photos');render();refreshSlides()}break}
    case 'premove':if(arm(b,'Tap again to remove')){const P=photos(),p=P.photos.find(x=>x.id===ds.id);if(p){
        if(p.asset&&ASSETS)ASSETS.delete(p.asset).catch(()=>{});P.photos=P.photos.filter(x=>x.id!==p.id);S.photoSel=null;markDirty('photos');render();refreshSlides()}}break;
    case 'delalbum':{const P=photos(),a=P.albums[+ds.a];if(P.albums.length<2){toast('Keep at least one album');break}
      const has=P.photos.some(p=>p.album===a);if(has&&!arm(b,'Photos move to '+P.albums.find(x=>x!==a)))break;
      const to=P.albums.find(x=>x!==a);P.photos.forEach(p=>{if(p.album===a)p.album=to});P.albums=P.albums.filter(x=>x!==a);if(P.active===a)P.active=ALL;
      markDirty('photos');render();refreshSlides();break}
    case 'renitem':S.editItem={c:+ds.c,g:+ds.g,i:+ds.i};render();break;
    case 'gotoedit':S.sheet=null;drawSheet();S.view='lib';S.editSec='acts';savePrefs();render();APP.scrollTo(0,APP.scrollHeight);{const n=$('input[data-add="cat"]');if(n)n.focus()}break;
    case 'opendoc':S.sheet=null;drawSheet();S.view='docs';S.doc=ds.id;render();APP.scrollTo(0,0);break;
    case 'zoom':S.zoom=!S.zoom;render();break;
    case 'backup':backup();break;
    case 'hideticker':try{localStorage.setItem('daybook:tickerhide',todayKey())}catch(e){}renderTicker();break;
    case 'restoreok':applyRestore();break;
    case 'restorecancel':S.pendingRestore=null;render();break;
    case 'docback':S.doc=null;render();APP.scrollTo(0,0);break;
    case 'delitem':lib().cats[+ds.c].groups[+ds.g].items.splice(+ds.i,1);libChanged();break;
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('input[data-add],input[data-edit]')){ev.preventDefault();addFrom(ev.target,true)}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.matches('input[data-edit="album"]')){const v=t.value.trim(),P=photos(),old=P.albums[+t.dataset.a];
    if(v&&v!==old&&!P.albums.includes(v)){P.albums[+t.dataset.a]=v;P.photos.forEach(p=>{if(p.album===old)p.album=v});if(P.active===old)P.active=v;markDirty('photos')}
    setTimeout(render,0);return}
  if(t.id==='p-speed'){photos().speed=+t.value;markDirty('photos');scheduleSlide();return}
  if(t.id==='p-move'){const p=photos().photos.find(x=>x.id===t.dataset.id);if(p){p.album=t.value;markDirty('photos');render();refreshSlides()}return}
  if(t.matches('input[data-upload]')&&t.files&&t.files.length){uploadPhotos([...t.files],t.dataset.upload);return}
  if(t.matches('input[data-edit]')){const v=t.value.trim();if(!v){S.editItem=null;setTimeout(render,0);return}
    const c=lib().cats[+t.dataset.c];
    if(t.dataset.edit==='item'){const g=c.groups[+t.dataset.g];if(!g.items.includes(v))g.items[+t.dataset.i]=v;S.editItem=null;setTimeout(libChanged,0);return}
    if(t.dataset.edit==='cat')c.name=v;else{const g=c.groups[+t.dataset.g],O=S.openGrps;if(O&&O.has(c.id+'|'+g.name)){O.delete(c.id+'|'+g.name);O.add(c.id+'|'+v)}g.name=v}markDirty('library')}
  else if(t.matches('input[data-add]'))addFrom(t,false);
  else if(t.id==='f-weeks')S.sheet.weeks=+t.value;
  else if(t.id==='restore'&&t.files&&t.files[0]){t.files[0].text().then(txt=>{let o;try{o=JSON.parse(txt)}catch(e){}
    if(!o||o.app!=='daybook'||!o.library||!o.months){toast("That file isn't a Daybook backup");return}
    S.pendingRestore=o;render()})}
});
document.addEventListener('focusout',ev=>{if(ev.target.matches('input[data-edit="item"]'))setTimeout(()=>{if(S.editItem){S.editItem=null;render()}},0)});
function addFrom(t,refocus){
  if(t.matches('[data-edit]')){t.blur();return}
  const v=t.value.trim();if(!v)return;
  if(t.dataset.add==='album'){const P=photos();t.value='';if(!P.albums.includes(v)){P.albums.push(v);markDirty('photos')}render();
    if(refocus){const n=document.querySelector('input[data-add="album"]');if(n)n.focus()}return}
  if(t.dataset.add==='sheetitem'){t.value='';readInputs();const cat=catById(S.sheet.cat);if(!cat)return;let gi=+t.dataset.g;
    if(gi<0){cat.groups.push({name:'Options',items:[]});gi=cat.groups.length-1}
    const g=cat.groups[gi];const fresh=+t.dataset.g<0;
    if(!g.items.includes(v)){g.items.push(v);S.sheet.picks.add(v);markDirty('library');
      if(!fresh){const bt=document.createElement('button');bt.className='chip on';bt.style.setProperty('--c',catColor(cat));bt.dataset.act='pick';bt.dataset.g=gi;bt.dataset.i=g.items.length-1;bt.textContent=v;t.before(bt);if(!refocus)t.blur();return}}
    drawSheet();
    if(refocus){const n=document.querySelector(`input[data-add="sheetitem"][data-g="${gi}"]`);if(n)n.focus()}return}const L=lib(),ds=t.dataset,sel=`input[data-add="${ds.add}"]`+(ds.c!=null?`[data-c="${ds.c}"]`:'')+(ds.g!=null?`[data-g="${ds.g}"]`:'');
  t.value='';
  const OC=S.openCats||(S.openCats=new Set()),OG=S.openGrps||(S.openGrps=new Set());
  if(ds.add==='cat'){const id=rid();L.cats.push({id,name:v,slot:L.cats.length%PALETTE.length,color:PALETTE[L.cats.length%PALETTE.length],groups:[]});OC.add(id);refocus=true}
  else if(ds.add==='grp'){const c=L.cats[+ds.c];if(!c.groups.some(g=>g.name===v)){c.groups.push({name:v,items:[]});OG.add(c.id+'|'+v)}}
  else{const g=L.cats[+ds.c].groups[+ds.g];if(g.items.includes(v))return;g.items.push(v);markDirty('library');
    const ii=g.items.length-1,sp=document.createElement('span');sp.className='chip ed';
    sp.innerHTML=`<button data-act="renitem" data-c="${ds.c}" data-g="${ds.g}" data-i="${ii}"></button><button class="x" data-act="delitem" data-c="${ds.c}" data-g="${ds.g}" data-i="${ii}" aria-label="Remove">&times;</button>`;
    sp.firstChild.textContent=v;t.before(sp);if(!refocus)t.blur();return}
  libChanged();
  if(refocus){const n=document.querySelector(ds.add==='cat'?`input[data-add="grp"][data-c="${L.cats.length-1}"]`:ds.add==='grp'?`input[data-add="item"][data-c="${ds.c}"][data-g="${L.cats[+ds.c].groups.length-1}"]`:sel);if(n)n.focus()}
}
function scrollToday(){const el=document.getElementById('d-'+todayKey());if(el)el.scrollIntoView({block:'center',behavior:'smooth'})}

init();
</script>
